config-version = 2

accordion-padding = 30

after-login-command = []
after-startup-command = ["exec-and-forget sketchybar", "exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0"]
automatically-unhide-macos-hidden-apps = true
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
exec-on-workspace-change = ["/bin/bash", "-c", "sketchybar --trigger aerospace_workspace_changed FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE"]
on-focused-monitor-changed = ["move-mouse monitor-lazy-center"]

persistent-workspaces = [
    "1",
    "2",
    "3",
    "T",
    "B",
    "I",
    "M",
    "N",
    "F",
]
start-at-login = false

[exec]
inherit-env-vars = true

[exec.env-vars]
PATH = "/run/current-system/sw/bin:/etc/profiles/per-user/nellurup/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}"

[gaps.inner]
horizontal = 8
vertical = 8

[gaps.outer]
bottom = 8
left = 8
right = 8
top = [{monitor = {built-in = 8}}, 40]

[key-mapping]
preset = "qwerty"

[mode.join.binding]
esc = "mode main"
h = ["join-with left", "mode main"]
j = ["join-with down", "mode main"]
k = ["join-with up", "mode main"]
l = ["join-with right", "mode main"]

[mode.main.binding]
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-a = "workspace A"
alt-b = "workspace B"
alt-backslash = "focus-monitor --wrap-around next"
alt-backtick = "focus-back-and-forth"
alt-c = "workspace C"
alt-comma = "layout accordion horizontal vertical"
alt-ctrl-h = "swap left"
alt-ctrl-j = "swap down"
alt-ctrl-k = "swap up"
alt-ctrl-l = "swap right"
alt-d = "exec-and-forget open raycast://"
alt-e = "workspace E"
alt-enter = "exec-and-forget open -a WezTerm"
alt-f = "workspace F"
alt-g = "workspace G"
alt-h = "focus --boundaries-action wrap-around-the-workspace left"
alt-i = "workspace I"
alt-j = "focus --boundaries-action wrap-around-the-workspace down"
alt-k = "focus --boundaries-action wrap-around-the-workspace up"
alt-l = "focus --boundaries-action wrap-around-the-workspace right"
alt-m = "workspace M"
alt-minus = "macos-native-minimize"
alt-n = "workspace N"
alt-o = "workspace O"
alt-p = "workspace P"
alt-q = "workspace Q"
alt-r = "mode resize"
alt-s = "workspace S"
alt-shift-1 = ["move-node-to-workspace 1", "workspace 1"]
alt-shift-2 = ["move-node-to-workspace 2", "workspace 2"]
alt-shift-3 = ["move-node-to-workspace 3", "workspace 3"]
alt-shift-4 = ["move-node-to-workspace 4", "workspace 4"]
alt-shift-5 = ["move-node-to-workspace 5", "workspace 5"]
alt-shift-6 = ["move-node-to-workspace 6", "workspace 6"]
alt-shift-7 = ["move-node-to-workspace 7", "workspace 7"]
alt-shift-8 = ["move-node-to-workspace 8", "workspace 8"]
alt-shift-9 = ["move-node-to-workspace 9", "workspace 9"]
alt-shift-a = ["move-node-to-workspace A", "workspace A"]
alt-shift-b = ["move-node-to-workspace B", "workspace B"]
alt-shift-backslash = "move-node-to-monitor --wrap-around --focus-follows-window next"
alt-shift-c = ["move-node-to-workspace C", "workspace C"]
alt-shift-d = ["move-node-to-workspace D", "workspace D"]
alt-shift-e = ["move-node-to-workspace E", "workspace E"]
alt-shift-equal = "resize smart +50"
alt-shift-f = ["move-node-to-workspace F", "workspace F"]
alt-shift-g = ["move-node-to-workspace G", "workspace G"]
alt-shift-h = "move left"
alt-shift-i = ["move-node-to-workspace I", "workspace I"]
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"
alt-shift-m = ["move-node-to-workspace M", "workspace M"]
alt-shift-minus = "resize smart -50"
alt-shift-n = ["move-node-to-workspace N", "workspace N"]
alt-shift-o = ["move-node-to-workspace O", "workspace O"]
alt-shift-p = ["move-node-to-workspace P", "workspace P"]
alt-shift-q = "close --quit-if-last-window"
alt-shift-r = ["move-node-to-workspace R", "workspace R"]
alt-shift-s = ["move-node-to-workspace S", "workspace S"]
alt-shift-semicolon = "mode service"
alt-shift-slash = "mode join"
alt-shift-space = "fullscreen --no-outer-gaps"
alt-shift-t = ["move-node-to-workspace T", "workspace T"]
alt-shift-tab = "move-workspace-to-monitor --wrap-around next"
alt-shift-u = ["move-node-to-workspace U", "workspace U"]
alt-shift-v = "exec-and-forget open \"raycast://extensions/raycast/clipboard-history/clipboard-history\""
alt-shift-w = ["move-node-to-workspace W", "workspace W"]
alt-shift-x = ["move-node-to-workspace X", "workspace X"]
alt-shift-y = ["move-node-to-workspace Y", "workspace Y"]
alt-shift-z = ["move-node-to-workspace Z", "workspace Z"]
alt-slash = "layout tiles horizontal vertical"
alt-space = "fullscreen"
alt-t = "workspace T"
alt-tab = "workspace-back-and-forth"
alt-u = "workspace U"
alt-v = "workspace V"
alt-w = "workspace W"
alt-x = "workspace X"
alt-y = "workspace Y"
alt-z = "workspace Z"

[mode.resize.binding]
enter = "mode main"
equal = "resize smart +50"
esc = "mode main"
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
minus = "resize smart -50"
shift-h = "resize width -200"
shift-j = "resize height +200"
shift-k = "resize height -200"
shift-l = "resize width +200"

[mode.service.binding]
b = ["balance-sizes", "mode main"]
backspace = ["close-all-windows-but-current", "mode main"]
e = ["enable toggle", "mode main"]
esc = ["reload-config", "mode main"]
f = ["layout floating tiling", "mode main"]
r = ["flatten-workspace-tree", "mode main"]

[[on-window-detected]]
run = "move-node-to-workspace T"

[on-window-detected.if]
app-id = "com.github.wez.wezterm"

